name: Build WhatsApp preview images
on:
  push:
    branches: [main]
    paths:
      - "preview-administracion.svg"
      - "preview-gestores.svg"
      - ".github/workflows/build-whatsapp-previews.yml"
      - "admin.html"
      - "gestores.html"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert SVG posters to JPEG
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          for name in ("administracion", "gestores"):
              png = f"/tmp/{name}.png"
              cairosvg.svg2png(url=f"preview-{name}.svg", write_to=png, output_width=1200, output_height=630)
              Image.open(png).convert("RGB").save(f"preview-{name}.jpg", "JPEG", quality=88, optimize=True)
          PY
      - name: Publish JPEG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-administracion.jpg preview-gestores.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publicar imágenes JPEG para vistas previas de WhatsApp"
            git push origin main
          fi
